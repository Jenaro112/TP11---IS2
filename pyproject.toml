[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "json2csv-filter"
version = "1.0.0"
description = "Herramienta de filtro para convertir archivos JSON a CSV con estándares de calidad de software."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jenaro Galdini" }]
keywords = ["json", "csv", "converter", "quality", "filter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "venv",
    ".venv",
    "src/collatz/collatz_original.py",
    "scratch",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | src/collatz/collatz_original\.py
  | scratch
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv",
    "src/collatz/collatz_original.py",
    "scratch",
]

[tool.pyright]
pythonVersion = "3.10"
exclude = [
    "**/venv",
    "**/.venv",
    "src/collatz/collatz_original.py",
    "scratch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=src --cov=json2csv --cov-report=term-missing"
